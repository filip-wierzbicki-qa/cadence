<div class="select" [class.select--open]="isOpen()">
  <button
    type="button"
    class="select__trigger"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="isOpen() ? listId + '-' + activeIndex() : null"
    [disabled]="isDisabled()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="select__value">{{ selectedLabel }}</span>
    <svg lucideChevronDown class="select__chevron" aria-hidden="true"></svg>
  </button>

  @if (isOpen()) {
    <ul
      class="select__list"
      role="listbox"
      [id]="listId"
      [attr.aria-label]="label()"
      animate.enter="select__list--in"
      animate.leave="select__list--out"
    >
      @for (option of options(); track option.value; let i = $index) {
        <li
          class="select__option"
          role="option"
          [id]="listId + '-' + i"
          [class.select__option--active]="activeIndex() === i"
          [attr.aria-selected]="value() === option.value"
          (mouseenter)="activeIndex.set(i)"
          (click)="select(option)"
        >
          <span>{{ option.label }}</span>
          @if (value() === option.value) {
            <svg lucideCheck class="select__check" aria-hidden="true"></svg>
          }
        </li>
      }
    </ul>
  }
</div>
