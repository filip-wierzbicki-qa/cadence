<div class="settings">
  <h1 class="settings__title">Settings</h1>

  <section class="settings-section" aria-labelledby="settings-profile">
    <h2 class="settings-section__title" id="settings-profile">Profile</h2>

    @if (currentUser(); as user) {
      <div class="profile">
        <div class="profile__avatar" aria-hidden="true">{{ user.profileInitial }}</div>

        <div class="profile__details">
          <span class="profile__name">{{ user.display_name || 'User' }}</span>
          <span class="profile__email">{{ user.email }}</span>
        </div>
      </div>
    } @else {
      <div class="profile" aria-busy="true">
        <div class="settings__skeleton settings__skeleton--avatar"></div>

        <div class="profile__details">
          <div class="settings__skeleton settings__skeleton--name"></div>
          <div class="settings__skeleton settings__skeleton--email"></div>
        </div>
      </div>
    }
  </section>

  <section class="settings-section" aria-labelledby="settings-thresholds">
    <h2 class="settings-section__title" id="settings-thresholds">Score thresholds</h2>

    <dl class="thresholds">
      @for (band of thresholds; track band.label) {
        <div class="threshold" [style.--tone]="band.color">
          <dt class="threshold__label">
            <span class="threshold__dot" aria-hidden="true"></span>
            {{ band.label }}
          </dt>

          <dd class="threshold__value">{{ band.from }}–{{ band.to }}%</dd>
        </div>
      }
    </dl>

    <p class="settings-section__hint">These ranges are fixed for now.</p>
  </section>
</div>
