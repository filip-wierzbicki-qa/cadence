<div class="register">
  <a class="back-link" routerLink="/login">
    <svg lucideArrowLeft aria-hidden="true"></svg>
    Back to sign in
  </a>

  <h1>Create your account</h1>
  <p class="subtitle">Start tracking your goals in under a minute.</p>

  <form [formGroup]="registerForm" (ngSubmit)="submit()">
    <app-input
      formControlName="username"
      label="Name"
      type="text"
      autocomplete="nickname"
      placeholder="What should we call you?"
      [autoFocus]="true"
    />

    <app-input
      formControlName="email"
      label="Email"
      type="email"
      autocomplete="email"
      placeholder="you@email.com"
    />

    <app-input
      formControlName="password"
      label="Password"
      type="password"
      autocomplete="new-password"
      placeholder="••••••••"
    />
    <p class="hint">At least {{ minPasswordLength }} characters.</p>

    <app-input
      formControlName="confirmPassword"
      label="Confirm password"
      type="password"
      autocomplete="new-password"
      placeholder="••••••••"
    />

    @if (errorMessage(); as message) {
      <p class="banner banner--error" role="alert">{{ message }}</p>
    }

    <app-button type="submit" [loading]="isSubmitting()" [disabled]="registerForm.invalid">
      {{ isSubmitting() ? 'Creating account…' : 'Create account' }}
    </app-button>
  </form>

  <p class="footer">
    Already have an account?
    <a routerLink="/login">Sign in</a>
  </p>
</div>
