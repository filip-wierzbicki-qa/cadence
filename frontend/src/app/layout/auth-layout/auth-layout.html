<div class="auth-layout">
  <aside class="hero">
    <app-logo />
    <div class="hero-content">
      <h1>Build the habits that move you forward.</h1>

      <p>
        Track daily activities, hit your goals, and watch your progress grow - all in one calm,
        quiet place.
      </p>

      <div class="chips" aria-hidden="true">
        <span>Steps</span>
        <span>Calories</span>
        <span>Study</span>
        <span>Reading</span>
      </div>
    </div>
    <p>A personal dashboard for health & productivity.</p>
  </aside>

  <main class="content">
    <!-- One column, so the brand and the form share the same left edge at every width. -->
    <div class="content__column">
      <!-- The hero is hidden on small screens, so the brand moves above the form. -->
      <a class="content__brand" routerLink="/login" aria-label="Cadence">
        <app-logo size="lg" />
      </a>

      <router-outlet />
    </div>
  </main>
</div>
